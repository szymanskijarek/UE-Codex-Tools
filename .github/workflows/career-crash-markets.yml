name: career-crash-markets

# Deploys the Crypto Bros market feed (apps/markets → feed.careercrash.org) when
# prod changes. Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID;
# until they exist (and wrangler.toml has the real KV namespace id) the job
# skips itself. Launch steps: career-crash/PIPELINES.md §7.2.

on:
  push:
    branches: [prod]
    paths:
      - 'career-crash/apps/markets/**'
      - 'career-crash/packages/**'
      - '.github/workflows/career-crash-markets.yml'
  workflow_dispatch:

concurrency: career-crash-markets

defaults:
  run:
    working-directory: career-crash

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Ready to deploy?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set; skipping market feed deploy."
          elif grep -q '00000000000000000000000000000000' apps/markets/wrangler.toml; then
            echo "::notice::wrangler.toml still has the placeholder KV id; skipping market feed deploy."
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.go
        with:
          package_json_file: career-crash/package.json
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: career-crash/pnpm-lock.yaml
      - if: steps.ready.outputs.go
        run: pnpm install --frozen-lockfile
      - if: steps.ready.outputs.go
        run: pnpm content:build
      - name: Tests
        if: steps.ready.outputs.go
        run: pnpm exec vitest run apps/markets packages/game-rules
      - name: Deploy
        if: steps.ready.outputs.go
        run: pnpm deploy:markets
      - name: Smoke test
        if: steps.ready.outputs.go
        run: |
          sleep 10
          # The first request fills an empty store, so latest answers 200 with a snapshot.
          code=$(curl -s -o latest.json -w '%{http_code}' https://feed.careercrash.org/crypto/latest.json)
          echo "feed.careercrash.org answered $code"; head -c 200 latest.json; echo
          [ "$code" = 200 ] && grep -q '"coins"' latest.json
