name: career-crash-votes

# Deploys the Diplomatic Incident vote service (apps/votes → vote.careercrash.org)
# when prod changes. Needs the same repo secrets as the market feed,
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the job skips
# itself. Launch steps: career-crash/PIPELINES.md §7.3.

on:
  push:
    branches: [prod]
    paths:
      - 'career-crash/apps/votes/**'
      - 'career-crash/packages/**'
      - '.github/workflows/career-crash-votes.yml'
  workflow_dispatch:

concurrency: career-crash-votes

defaults:
  run:
    working-directory: career-crash

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Ready to deploy?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set; skipping vote service deploy."
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.go
        with:
          package_json_file: career-crash/package.json
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: career-crash/pnpm-lock.yaml
      - if: steps.ready.outputs.go
        run: pnpm install --frozen-lockfile
      - if: steps.ready.outputs.go
        run: pnpm content:build
      - name: Tests
        if: steps.ready.outputs.go
        run: pnpm exec vitest run apps/votes apps/client/test/incident-votes.test.ts
      - name: Deploy
        if: steps.ready.outputs.go
        run: pnpm deploy:votes
      - name: Smoke test
        if: steps.ready.outputs.go
        run: |
          sleep 10
          code=$(curl -s -o config.json -w '%{http_code}' https://vote.careercrash.org/config)
          echo "vote.careercrash.org/config answered $code"; cat config.json; echo
          [ "$code" = 200 ] && grep -q '"bits"' config.json
          hour=$(date -u +%Y-%m-%dT%H)
          code=$(curl -s -o hour.json -w '%{http_code}' "https://vote.careercrash.org/hour/$hour?s=0")
          echo "/hour/$hour answered $code"; head -c 300 hour.json; echo
          [ "$code" = 200 ] && grep -q '"frozen"' hour.json
