# The market feeds for careercrash.org/cryptobro (docs/career-crash/08-cryptobro.md §10)
# and /wallstreet (13-regards-wall-street.md §10.2). Every hour it fetches the top
# coins from CoinGecko, and every half hour of the New York session the stocks
# from Alpaca; snapshots go to KV and the pages read them from feed.careercrash.org.
name = "career-crash-markets"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Its own subdomain, so it never competes with the site's routes.
routes = [{ pattern = "feed.careercrash.org", custom_domain = true }]

# Crypto at the top of every hour, stocks every half hour (the Worker skips them
# outside market hours); each again two minutes later in case the first try failed.
[triggers]
crons = ["0,2,30,32 * * * *"]

[[kv_namespaces]]
binding = "FEED"
id = "43f3682bff5f492da698731987f92196" # the id of the KV namespace "career-crash-feed" (dashboard → Storage & Databases → KV)

[vars]
# Pages that may read the feed from the browser.
ALLOWED_ORIGIN = "https://careercrash.org,https://www.careercrash.org,http://localhost:5173"

# Optional secret (dashboard → career-crash-markets → Settings → Variables and Secrets, type Secret):
#   COINGECKO_KEY: a free CoinGecko Demo API key. Without it the public, keyless API is used,
#   which is enough for one request an hour.
#   ALPACA_KEY_ID, ALPACA_SECRET: Alpaca market data keys (free Basic plan, IEX feed).
#   Without them the stocks feed is idle and /wallstreet runs on its sample.
