name = "career-crash-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "career-crash"
database_id = "00000000-0000-0000-0000-000000000000" # replace after `wrangler d1 create career-crash`
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"

# Secrets (wrangler secret put ...): SESSION_SECRET, TURNSTILE_SECRET (optional)
# For local dev put them in .dev.vars
